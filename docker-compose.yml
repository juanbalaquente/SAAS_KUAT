services:
  mysql:
    image: mysql:8.0
    container_name: saas_kuat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kuat@2024
      MYSQL_DATABASE: saas_kuat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saas_kuat

  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: saas_kuat_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: kuat_evolution_key_2024
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR
      LOG_BAILEYS: error
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - saas_kuat

volumes:
  mysql_data:
  evolution_data:

networks:
  saas_kuat:
    driver: bridge
